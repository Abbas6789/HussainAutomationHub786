#
#  ⚠️  NEVER commit this file to GitHub.
#      Add  .streamlit/secrets.toml  to your .gitignore
#
#  On Streamlit Cloud: paste these values in
#  App Settings → Secrets  (no file needed on cloud).
# ============================================================

[firebase]
# Your Firebase Realtime Database URL (ends with .firebaseio.com)
database_url = "https://YOUR-PROJECT-default-rtdb.firebaseio.com"

# Firebase Database Secret (legacy auth token)
# Firebase Console → Project Settings → Service Accounts → Database Secrets
db_secret = "YOUR_FIREBASE_DATABASE_SECRET_HERE"


# ── Optional: override Google OAuth redirect URI ──────────────────────────────
# Only needed if auto-detection fails (e.g. custom domain).
# Default for local: http://localhost:8501/
# Default for cloud: https://YOUR-APP.streamlit.app/

# [google_oauth]
# redirect_uri = "https://your-custom-domain.com/"

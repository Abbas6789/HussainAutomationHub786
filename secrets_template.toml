# ── SECTION 1: Google Sheets connection ──────────────────────────────────────
#
#  HOW TO GET YOUR SERVICE ACCOUNT (one-time setup):
#  Step 1. Go to  https://console.cloud.google.com
#  Step 2. Create or select a project
#  Step 3. Enable "Google Sheets API" and "Google Drive API"
#          (APIs & Services → Enable APIs → search and enable both)
#  Step 4. IAM & Admin → Service Accounts → Create Service Account
#  Step 5. Keys tab → Add Key → JSON → Download the file
#  Step 6. Open the JSON file, copy ALL contents
#  Step 7. Paste between the triple-quotes in private_key_json below
#
#  SHARE YOUR SHEET WITH THE SERVICE ACCOUNT EMAIL:
#  Step 8. Open your Google Sheet
#  Step 9. Share → paste the client_email from the JSON
#           e.g.  myapp@myproject.iam.gserviceaccount.com
#  Step 10. Set role to "Editor" (so comments can be written back)
#  Step 11. Click Send — done, no file upload to GitHub needed
# ─────────────────────────────────────────────────────────────────

[connections.gsheets]
spreadsheet = "https://docs.google.com/spreadsheets/d/1cWzMMmuJsmYCy9L-GOyAbwSzAmAe7zD9v4a3yUdPJOA/edit?usp=drivesdk"

# Paste the ENTIRE downloaded Service Account JSON between the triple-quotes:
private_key_json = """
{
  "type": "service_account",
  "project_id": "YOUR_PROJECT_ID",
  "private_key_id": "YOUR_KEY_ID",
  "private_key": "-----BEGIN PRIVATE KEY-----\nYOUR_FULL_PRIVATE_KEY_LINES_HERE\n-----END PRIVATE KEY-----\n",
  "client_email": "YOUR_SERVICE_ACCOUNT_EMAIL@YOUR_PROJECT.iam.gserviceaccount.com",
  "client_id": "YOUR_CLIENT_ID",
  "auth_uri": "https://accounts.google.com/o/oauth2/auth",
  "token_uri": "https://oauth2.googleapis.com/token",
  "auth_provider_x509_cert_url": "https://www.googleapis.com/oauth2/v1/certs",
  "client_x509_cert_url": "https://www.googleapis.com/robot/v1/metadata/x509/YOUR_SERVICE_ACCOUNT_EMAIL"
}
"""


